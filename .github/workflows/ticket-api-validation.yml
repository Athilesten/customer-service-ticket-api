name: Ticket API validation
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_DB: helpdesk
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TICKET_DB_BACKEND: ${{ matrix.database }}
      TICKET_PG_PASSWORD: ci-only-password
      TICKET_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput --verbosity 2
      - if: matrix.database == 'sqlite'
        run: python scripts/demo.py --tickets 50 --runs 5
