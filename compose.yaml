services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${TICKET_PG_PASSWORD:?Set TICKET_PG_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${TICKET_PG_PORT:-5432}:5432"
    volumes:
      - helpdesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  helpdesk-data:
